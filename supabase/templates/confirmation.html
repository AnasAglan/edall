<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>تفعيل حساب ED-ALL</title>
  </head>
  <body style="margin:0;padding:24px;background:#f3f4f6;font-family:Arial,Tahoma,sans-serif;color:#172033;direction:rtl;text-align:right;">
    <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:18px;padding:28px 24px;text-align:center;">
      <img src="https://edall.lovable.app/favicon.ico?v=20261110" width="72" height="72" alt="ED-ALL" style="display:block;width:72px;height:72px;object-fit:contain;margin:0 auto 16px;border-radius:14px;">
      <h2 style="margin:0 0 12px;color:#1f2937;">مرحباً بك في ED-ALL</h2>
      <p style="margin:0 0 18px;color:#475569;line-height:1.8;">استخدم رمز التحقق التالي لتفعيل حسابك. يمكنك أيضاً الضغط على زر التفعيل الموجود أسفل الرمز.</p>
      <div style="display:inline-block;min-width:220px;margin:6px auto 18px;padding:16px 22px;border-radius:12px;background:#fff3e8;color:#e56700;font-size:32px;font-weight:800;letter-spacing:8px;direction:ltr;text-align:center;">{{ .Token }}</div>
      <p style="margin:0 0 18px;color:#64748b;line-height:1.8;">أدخل الرمز في صفحة تفعيل الحساب. إذا لم يعمل الرمز، يمكنك تفعيل بريدك مباشرة من الزر التالي.</p>
      <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#fc8019;color:#ffffff;text-decoration:none;padding:13px 26px;border-radius:10px;font-weight:700;">تفعيل الحساب</a>
      <p style="margin:24px 0 0;color:#94a3b8;font-size:12px;line-height:1.8;">إذا لم تطلب إنشاء حساب في ED-ALL، يمكنك تجاهل هذه الرسالة.</p>
    </div>
  </body>
</html>
