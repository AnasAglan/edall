name: Daily video instance discovery

on:
  pull_request:
    paths:
      - "scripts/sync-video-instances.mjs"
      - "scripts/sync-video-instances.node-test.mjs"
      - "public/ed_piped_player.js"
      - "workers/extract-youtube-stream/index.ts"
      - "src/test/ed-piped-player.test.ts"
      - "src/test/ed-auth-rules.test.ts"
      - "workers/edall-assistant/**"
      - ".github/workflows/video-instances-sync.yml"
      - ".github/workflows/ed-piped-player-checks.yml"
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync-video-instances.mjs"
      - ".github/workflows/video-instances-sync.yml"

permissions:
  contents: write

concurrency:
  group: video-instance-registry
  cancel-in-progress: false

jobs:
  discover-and-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the triggering ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run platform tests
        run: |
          bun run test
          bun run build

      - name: Run worker and discovery tests
        run: |
          node --test scripts/sync-video-instances.node-test.mjs
          node --test workers/edall-assistant/authorization.test.mjs workers/edall-assistant/provider.test.mjs

      - name: Discover and probe official instances
        if: github.event_name != 'pull_request'
        run: node scripts/sync-video-instances.mjs

      - name: Validate registry before publishing changes
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("public/video-instances.json","utf8")); const all=[...(r.sources?.piped||[]),...(r.sources?.invidious||[])]; const ok=all.filter(x=>x.status==="healthy"||x.status==="degraded"); if(!r.sources?.piped?.length||!r.sources?.invidious?.length||!ok.length) throw new Error("Refusing to commit an empty or unusable video registry"); console.log(JSON.stringify({piped:r.sources.piped.length,invidious:r.sources.invidious.length,playable:ok.length}));'

      - name: Report incomplete provider discovery
        if: github.event_name != 'pull_request'
        run: node scripts/assert-video-registry-fresh.mjs

      - name: Commit changed registry
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(video): refresh public extractor instances"
          file_pattern: public/video-instances.json
          branch: main
