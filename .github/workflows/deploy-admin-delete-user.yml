name: Deploy ED-ALL admin account deletion function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/admin-delete-user/**"
      - ".github/workflows/deploy-admin-delete-user.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-admin-delete-user:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: iuaddjoofgrirzslzqfy
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials are configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy the dedicated function
        run: supabase functions deploy admin-delete-user --project-ref "$SUPABASE_PROJECT_ID" --yes
