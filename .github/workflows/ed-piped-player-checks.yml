name: ED video player checks

on:
  push:
    branches: [main]
    paths:
      - "public/ed_piped_player.js"
      - "workers/extract-youtube-stream/index.ts"
      - "src/test/ed-auth-rules.test.ts"
      - "scripts/sync-video-instances.node-test.mjs"
      - "public/ed_master.html"
      - "public/video-instances.json"
      - "scripts/**"
      - "workers/extract-youtube-stream/index.ts"
      - "src/test/ed-auth-rules.test.ts"
      - "scripts/sync-video-instances.node-test.mjs"
      - "supabase/functions/extract-youtube-stream/**"
      - "src/test/ed-piped-player.test.ts"
      - "package.json"
      - ".github/workflows/ed-piped-player-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/ed_piped_player.js"
      - "public/ed_master.html"
      - "public/video-instances.json"
      - "scripts/**"
      - "workers/extract-youtube-stream/index.ts"
      - "src/test/ed-auth-rules.test.ts"
      - "scripts/sync-video-instances.node-test.mjs"
      - "supabase/functions/extract-youtube-stream/**"
      - "src/test/ed-piped-player.test.ts"
      - "package.json"
      - ".github/workflows/ed-piped-player-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Run video player regression tests
        run: npm test -- --reporter=verbose

      - name: Check sync script syntax
        run: |
          node --check scripts/sync-video-instances.mjs
          node --check workers/edall-assistant/index.js

      - name: Test discovery and real media verification helpers
        run: node --test scripts/sync-video-instances.node-test.mjs

      - name: Check extractor deployment smoke script syntax
        run: node --check scripts/supabase-extractor-smoke-test.mjs

      - name: Check Deno Edge Function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Invidious extractors
        run: |
          deno check supabase/functions/extract-youtube-stream/index.ts
          deno check workers/extract-youtube-stream/index.ts

      - name: Discover and probe official Piped and Invidious instances
        run: node scripts/sync-video-instances.mjs

      - name: Validate daily instance registry
        run: |
          node -e "const r=require('./public/video-instances.json'); if(r.schemaVersion!==1 || !Array.isArray(r.sources?.piped) || !Array.isArray(r.sources?.invidious) || !r.sources.piped.length || !r.sources.invidious.length) process.exit(1); console.log('Piped:',r.sources.piped.length,'Invidious:',r.sources.invidious.length);"

      - name: Build platform
        run: npm run build
