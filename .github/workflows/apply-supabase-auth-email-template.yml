name: Apply Supabase Auth confirmation email template

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target environment (Staging first; select Production only after Staging verification)"
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  apply-confirmation-template:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secret
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repository Actions secret SUPABASE_ACCESS_TOKEN. Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi

      - name: Apply and verify confirmation template on selected environment
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TARGET_ENVIRONMENT: ${{ inputs.target || 'staging' }}
          SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && 'iuaddjoofgrirzslzqfy' || 'atpltvpwfammcnxcpvop' }}
        run: |
          set -euo pipefail
          echo "Applying link-only confirmation email template to $TARGET_ENVIRONMENT."

          template_json="$(jq -Rs . < supabase/templates/confirmation.html)"
          jq -n \
            --arg subject "تفعيل حسابك في ED-ALL" \
            --argjson content "$template_json" \
            '{mailer_subjects_confirmation: $subject, mailer_templates_confirmation_content: $content}' \
            > "$RUNNER_TEMP/auth-template.json"

          if ! curl --silent --show-error --fail-with-body \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/auth-template.json" \
            --output "$RUNNER_TEMP/auth-template-patch.json"; then
            cat "$RUNNER_TEMP/auth-template-patch.json" || true
            exit 1
          fi

          if ! curl --silent --show-error --fail-with-body \
            --request GET \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --output "$RUNNER_TEMP/auth-config.json"; then
            echo "::error::Template update was accepted, but verification could not read the Auth configuration."
            exit 1
          fi

          jq -e '
            .mailer_subjects_confirmation == "تفعيل حسابك في ED-ALL"
            and (.mailer_templates_confirmation_content | contains("{{ .ConfirmationURL }}"))
            and ((.mailer_templates_confirmation_content | contains("{{ .Token }}")) | not)
            and (.mailer_templates_confirmation_content | contains("اضغط على زر التفعيل"))
          ' "$RUNNER_TEMP/auth-config.json" > /dev/null

          echo "Supabase Auth confirmation template applied and verified for $TARGET_ENVIRONMENT."
