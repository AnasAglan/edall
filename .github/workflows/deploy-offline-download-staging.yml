name: Deploy Android offline authorization to Staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/authorize-offline-download/**"
      - "supabase/functions/_shared/offline-download.ts"
      - "supabase/functions/_shared/app-origin.ts"
      - "supabase/config.toml"
      - ".github/workflows/deploy-offline-download-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: atpltvpwfammcnxcpvop
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment credential is configured
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Deploy only the offline authorization function to Staging
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy authorize-offline-download --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

      - name: Verify the Staging function endpoint requires authentication
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/authorize-offline-download"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/offline-auth-smoke.txt" --write-out "%{http_code}" --request GET "$endpoint")"
          if [ "$status" != "401" ] && [ "$status" != "405" ]; then
            echo "::error::Unexpected Staging endpoint response: HTTP $status"
            cat "$RUNNER_TEMP/offline-auth-smoke.txt"
            exit 1
          fi
          echo "Staging endpoint is reachable and rejects unauthenticated or unsupported requests (HTTP $status)."
