name: Deploy video extractor function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/extract-youtube-stream/**"
      - ".github/workflows/deploy-video-extractor.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy Supabase Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add the Supabase personal access token to repository secrets, then rerun this workflow."
            exit 1
          fi
          npx --yes supabase@latest functions deploy extract-youtube-stream --project-ref iuaddjoofgrirzslzqfy
