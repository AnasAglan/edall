name: Deploy offline authorization to Production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm deployment of authorize-offline-download to the Production Supabase project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-offline-authorization-production
  cancel-in-progress: false

jobs:
  deploy-production:
    if: ${{ inputs.confirm_production_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: iuaddjoofgrirzslzqfy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production deployment credential is configured
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Configure it as a repository secret or in the production environment."
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Deploy only the offline authorization function to Production
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy authorize-offline-download --project-ref "$SUPABASE_PROJECT_ID" --use-api --yes

      - name: Verify the Production function endpoint rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/authorize-offline-download"
          status="$(curl --silent --show-error --max-time 20 --output "$RUNNER_TEMP/offline-auth-smoke.txt" --write-out "%{http_code}" --request GET "$endpoint")"
          if [ "$status" != "401" ] && [ "$status" != "405" ]; then
            echo "::error::Unexpected Production endpoint response: HTTP $status"
            cat "$RUNNER_TEMP/offline-auth-smoke.txt"
            exit 1
          fi
          echo "Production endpoint is reachable and rejects unauthenticated or unsupported requests (HTTP $status)."
