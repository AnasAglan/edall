name: Windows encrypted offline media vault

on:
  pull_request:
    paths:
      - "electron/safe-storage-adapter.cjs"
      - "electron/offline-vault.cjs"
      - "electron/offline-vault.test.cjs"
      - "electron/offline-library.cjs"
      - "electron/offline-library.test.cjs"
      - "electron/main.cjs"
      - "electron/preload.cjs"
      - "electron/offline.html"
      - "electron/offline.js"
      - ".github/workflows/electron-offline-vault.yml"
  push:
    branches: [main]
    paths:
      - "electron/safe-storage-adapter.cjs"
      - "electron/offline-vault.cjs"
      - "electron/offline-vault.test.cjs"
      - "electron/offline-library.cjs"
      - "electron/offline-library.test.cjs"
      - "electron/main.cjs"
      - "electron/preload.cjs"
      - "electron/offline.html"
      - "electron/offline.js"
      - ".github/workflows/electron-offline-vault.yml"

permissions:
  contents: read

jobs:
  encrypted-vault-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run encrypted media vault tests
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/safe-storage-adapter.cjs
          node --check electron/offline-vault.cjs
          node --check electron/offline-library.cjs
          node --check electron/offline.js
          node --test electron/offline-vault.test.cjs electron/offline-library.test.cjs

  windows-offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Electron desktop modules on Windows
        shell: pwsh
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/safe-storage-adapter.cjs
          node --check electron/offline-vault.cjs
          node --check electron/offline-library.cjs
          node --check electron/offline.js
      - name: Run encrypted offline storage tests on Windows
        run: node --test electron/offline-vault.test.cjs electron/offline-library.test.cjs
