name: Validate ED-ALL assistant

on:
  pull_request:
    branches: [main]
    paths:
      - "workers/edall-assistant/**"
      - "wrangler.assistant.toml"
      - "scripts/deploy-edall-assistant.mjs"
      - "public/ed_assistant.js"
      - "supabase/functions/admin-delete-user/**"
      - "workers/edall-assistant/provider.test.mjs"
      - ".github/workflows/validate-edall-assistant.yml"
  push:
    branches: [main, feat/assistant-student-engagement-and-notifications]
    paths:
      - "workers/edall-assistant/**"
      - "wrangler.assistant.toml"
      - "scripts/deploy-edall-assistant.mjs"
      - "public/ed_assistant.js"
      - "supabase/functions/admin-delete-user/**"
      - ".github/workflows/validate-edall-assistant.yml"

permissions:
  contents: read

jobs:
  syntax-and-tool-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Worker, deploy helper, and assistant UI syntax
        run: |
          node --check workers/edall-assistant/index.js
          node --check scripts/deploy-edall-assistant.mjs
          node --check workers/edall-assistant/provider.test.mjs
          node --check public/ed_assistant.js
          deno check supabase/functions/admin-delete-user/index.ts

      - name: Test Workers AI priority and Gemini fallback
        run: node --test workers/edall-assistant/provider.test.mjs
      - name: Verify deploy helper refuses a missing build secret
        run: |
          set +e
          output="$(env -u GEMINI_API_KEY node scripts/deploy-edall-assistant.mjs 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -q "Missing required Cloudflare Build secret: GEMINI_API_KEY"
      - name: Verify assistant tool routing and write coverage
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('workers/edall-assistant/index.js', 'utf8');
          const assistantConfig = fs.readFileSync('wrangler.assistant.toml', 'utf8');
          const deployHelper = fs.readFileSync('scripts/deploy-edall-assistant.mjs', 'utf8');
          const providerHelper = source.slice(source.indexOf('function summarizeProviderError'), source.indexOf('async function classifyExplicitWriteIntent'));
          const workersAiCall = providerHelper.indexOf('env.AI.run(workersAiModel, options)');
          const geminiCall = providerHelper.indexOf('fetchImpl(');
          if (workersAiCall < 0 || geminiCall <= workersAiCall) {
            throw new Error('Workers AI must be attempted before the Gemini fallback.');
          }
          if (!providerHelper.includes('await primeAssistantStream(workersResult)') || !providerHelper.includes('await primeAssistantStream(response.body)')) {
            throw new Error('Both provider streaming paths must validate and prime their response streams.');
          }
          if (!providerHelper.includes('await response.json()') || !providerHelper.includes('Array.isArray(result?.choices)')) {
            throw new Error('Gemini non-streaming responses must be parsed and validated as OpenAI-compatible JSON.');
          }
          if (!source.includes('GEMINI_MODEL = "gemini-3.6-flash"')) {
            throw new Error('The Gemini fallback must use the supported stable Gemini Flash model.');
          }
          if (!source.includes('مقارنة فعلية') || !source.includes('بالخط العريض')) {
            throw new Error('The assistant premium Arabic response-style instructions are missing.');
          }
          if (!assistantConfig.includes('GEMINI_API_KEY')) {
            throw new Error('GEMINI_API_KEY must be declared as a required Worker secret.');
          }
          for (const required of ['process.env.GEMINI_API_KEY', '--secrets-file', 'mode: 0o600', 'rmSync(secretsFile']) {
            if (!deployHelper.includes(required)) throw new Error('Secure deploy helper requirement missing: ' + required);
          }
          const deletion = fs.readFileSync('supabase/functions/admin-delete-user/index.ts', 'utf8');
          for (const required of ['auth.admin.deleteUser', 'has_role', 'created_by', 'wallet_transactions', 'targetRoles.includes("admin")', 'verified: true']) {
            if (!deletion.includes(required)) throw new Error('Account deletion safety check missing: ' + required);
          }
          const specs = [...source.matchAll(/\{ name: "([^"]+)", description:/g)].map(match => match[1]);
          const duplicates = specs.filter((name, index) => specs.indexOf(name) !== index);
          if (duplicates.length) throw new Error('Duplicate tool specs: ' + [...new Set(duplicates)].join(', '));
          const required = [
            'update_course', 'create_lesson', 'update_lesson', 'manage_lesson_media',
            'update_exam', 'update_exam_question', 'list_course_students',
            'get_student_progress', 'credit_user_wallet', 'update_platform_setting',
            'change_user_role', 'grade_essay_result', 'create_platform_user', 'send_password_reset', 'delete_platform_user', 'purchase_course', 'list_favorites', 'manage_favorite', 'manage_notifications_bulk', 'upload_profile_avatar'
          ];
          for (const name of required) {
            if (!specs.includes(name)) throw new Error('Missing tool spec: ' + name);
            if (!source.includes('if (name === "' + name + '")')) throw new Error('Missing handler: ' + name);
          }
          const writeStart = source.indexOf('const WRITE_TOOLS = new Set(');
          const writeEnd = source.indexOf(');', writeStart);
          const writeSet = source.slice(writeStart, writeEnd);
          for (const name of ['update_course','update_lesson','manage_lesson_media','credit_user_wallet','update_platform_setting','change_user_role','grade_essay_result','create_platform_user','send_password_reset','delete_platform_user','purchase_course','manage_favorite','manage_notifications_bulk','upload_profile_avatar']) {
            if (!writeSet.includes('"' + name + '"')) throw new Error('Write tool missing verification gate: ' + name);
          }
          const writeVerb = source.match(/const writeVerb = "([^"]+)";/)?.[1];
          const platformObject = source.match(/const platformObject = "([^"]+)";/)?.[1];
          if (!writeVerb || !platformObject) throw new Error('Write-intent dictionaries are missing');
          const intentPattern = new RegExp(writeVerb + "\\s*.*" + platformObject + "|" + platformObject + ".*" + writeVerb, "i");
          for (const phrase of ['اشتري الكورس', 'ضيف الكورس للمفضلة', 'ارفع صورتي الشخصية', 'حدد كل الإشعارات كمقروءة']) {
            if (!intentPattern.test(phrase)) throw new Error('Write intent was not recognized: ' + phrase);
          }
          if (!source.includes('purchased|uploaded|updated|deleted')) throw new Error('False-success guard does not cover recent write types');
          if (!source.includes('شراء|رفع|تحديد|حذف|تعديل|تحديث')) throw new Error('Arabic false-success guard coverage is incomplete');
          if (!source.includes('resultData?.verified === true')) throw new Error('Verified write gate missing');
          if (!source.includes('hasConfirmedDestructiveAction(messages)')) throw new Error('Destructive confirmation gate missing');
          console.log('Validated ' + specs.length + ' unique assistant tools.');
          NODE
